# 由 scripts/render_observability.sh 从本模板渲染；勿手工改 prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    gateway: gateway-01
    role: gateway

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9901
        labels:
          role: gateway
          gateway: gateway-01
          host: gateway-01

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          role: host
          gateway: gateway-01
          host: gateway-01

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          role: observability
          gateway: gateway-01
          host: gateway-01

# 可选：remote_write 到集中 Prometheus（在 .env 设置 PROMETHEUS_REMOTE_WRITE_URL）
