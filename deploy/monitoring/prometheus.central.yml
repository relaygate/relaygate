# 集中 Prometheus：抓取两台网关（请按实际可达地址修改 targets）
# 常见接入方式：
# 1) 内网直连 10.x:9901 / :9100（管理口仅 VPC）
# 2) 边缘 Prometheus remote_write 到本实例（见各网关 .env PROMETHEUS_REMOTE_WRITE_URL）
# 3) SSH 隧道把远端 9901/9100 映射到本机不同本地端口

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: relaygate
    monitor: central

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["gateway-01.internal:9901"]
        labels:
          gateway: gateway-01
          role: gateway
          host: gateway-01
      - targets: ["gateway-02.internal:9901"]
        labels:
          gateway: gateway-02
          role: gateway
          host: gateway-02

  - job_name: node
    static_configs:
      - targets: ["gateway-01.internal:9100"]
        labels:
          gateway: gateway-01
          role: host
          host: gateway-01
      - targets: ["gateway-02.internal:9100"]
        labels:
          gateway: gateway-02
          role: host
          host: gateway-02

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          role: observability
          gateway: central
