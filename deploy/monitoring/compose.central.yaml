# 集中式 Prometheus + Grafana（独立监控主机，或 gateway-01 旁路）
# 抓取两台网关的 Envoy/node_exporter（经 SSH 隧道 / 内网 / Tailscale）
#
# 启动:
#   cp .env.central.example .env.central && chmod 600 .env.central
#   docker compose -f deploy/monitoring/compose.central.yaml --env-file deploy/monitoring/.env.central up -d

name: relaygate-central-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: relaygate-central-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.central.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - central-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: relaygate-central-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - central-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  central-prometheus-data:
  central-grafana-data:
