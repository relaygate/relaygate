# gateway-01: Envoy 数据面 + 可观测性 + Go Panel
# 在仓库根执行:
#   docker compose -f deploy/compose.yaml --env-file .env up -d

name: game-gateway

services:
  envoy:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.39.0}
    container_name: gateway-01-envoy
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 45s
    stop_signal: SIGTERM
    volumes:
      - ../gateway/generated/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - envoy-logs:/var/log/envoy
    command:
      - /usr/local/bin/envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --service-cluster
      - gateway-01
      - --service-node
      - gateway-01
      - --log-level
      - info
      - --concurrency
      - "${ENVOY_CONCURRENCY:-0}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9901 && printf \"GET /ready HTTP/1.0\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q LIVE'",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: gateway-01-prometheus
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: gateway-01-grafana
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: gateway-01-node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  panel:
    build:
      context: ..
      dockerfile: Dockerfile.panel
    image: gateway-01-panel:local
    container_name: gateway-01-panel
    network_mode: host
    restart: unless-stopped
    environment:
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:?set PANEL_ADMIN_PASSWORD in .env}
      PANEL_BIND: ${PANEL_BIND:-127.0.0.1:8080}
      PANEL_ROOT: /workspace
      ENVOY_ADMIN_URL: http://127.0.0.1:9901
      PROMETHEUS_URL: http://127.0.0.1:9090
      RENDER_BIN: /usr/local/bin/gateway-render
    volumes:
      - ../config:/workspace/config
      - ../gateway:/workspace/gateway
      - ../deploy:/workspace/deploy
      - ../scripts:/workspace/scripts:ro
      - ../web:/workspace/web:ro
      - ../backups:/workspace/backups
      - ../.env:/workspace/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      - envoy
      - prometheus

volumes:
  envoy-logs:
  prometheus-data:
  grafana-data:
