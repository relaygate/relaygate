global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    gateway: gateway-01

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9901
        labels:
          role: gateway
          host: gateway-01

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          role: host
          host: gateway-01

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          role: observability
          host: gateway-01
