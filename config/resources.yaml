# 生产入口：端口 10001–10010 固定映射到 server-01–server-10
# 旁路 canary：11001 指向 server-01，验证通过后再启用 production
rules:
  - name: rule-canary-server-01-tcp
    kind: canary
    server: server-01
    protocol: TCP
    listen_port: 11001
    enabled: true
  - name: rule-canary-server-01-udp
    kind: canary
    server: server-01
    protocol: UDP
    listen_port: 11001
    enabled: true

  - name: rule-server-01-tcp-game
    kind: production
    server: server-01
    protocol: TCP
    listen_port: 10001
    enabled: false
  - name: rule-server-01-udp-game
