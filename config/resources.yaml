# 唯一资产源：语义化主机 / 端口 / 规则
# 修改本文件后执行: python scripts/render_config.py

meta:
  gateway_name: gateway-01
  game_name: main
  envoy_image: envoyproxy/envoy:v1.39.0
  admin_port: 9901
  admin_address: 127.0.0.1

gateway:
  name: gateway-01
  public_ip: 107.149.191.37
  ssh_port: 30455
  # 监听地址：公网入口用 0.0.0.0
  listen_address: 0.0.0.0

defaults:
  backend_tcp_port: 7777
  backend_udp_port: 7778
  # TCP 连接空闲超时
  tcp_idle_timeout: 3600s
  # UDP 会话空闲超时（按游戏心跳调整）
  udp_idle_timeout: 120s
  # 单规则最大并发连接/会话
  max_connections: 1024
  max_pending_requests: 256
  # TCP 新建连接本地限速（每秒 token）
  tcp_local_rate_limit_per_sec: 200
  tcp_local_rate_limit_burst: 400
  # 健康检查（仅 TCP cluster）
  health_check:
    timeout: 2s
    interval: 10s
    unhealthy_threshold: 3
    healthy_threshold: 2
  # nftables 限流默认值
  nft:
    tcp_new_conn_per_ip: 30/second
    udp_pps_per_ip: 500/second
    tcp_burst: 60
    udp_burst: 1000

# 后端游戏服：请将 address 替换为真实 IP
servers:
