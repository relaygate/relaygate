# 资产源模板（可安全提交）：语义化主机 / 端口 / 规则
# 真实业务配置请复制为 config/resources.yaml（该文件已被 .gitignore 忽略，不会入库）：
#   cp config/resources.example.yaml config/resources.yaml
# 修改 config/resources.yaml 后执行: ./bin/relaygate render

meta:
  gateway_name: gateway-01
  game_name: main
  envoy_image: envoyproxy/envoy:v1.39.0
  admin_port: 9901
  admin_address: 127.0.0.1

gateway:
  name: gateway-01
  public_ip: 203.0.113.10
  ssh_port: 30455
  # 监听地址：公网入口用 0.0.0.0
  listen_address: 0.0.0.0

defaults:
  backend_tcp_port: 7777
  backend_udp_port: 7778
  # TCP 连接空闲超时
  tcp_idle_timeout: 3600s
  # UDP 会话空闲超时（按游戏心跳调整）
  udp_idle_timeout: 120s
  # 单规则最大并发连接/会话
  max_connections: 1024
  max_pending_requests: 256
  # TCP 新建连接本地限速（每秒 token）
  tcp_local_rate_limit_per_sec: 200
  tcp_local_rate_limit_burst: 400
  # 健康检查（仅 TCP cluster）
  health_check:
    timeout: 2s
    interval: 10s
    unhealthy_threshold: 3
    healthy_threshold: 2
  # nftables 限流默认值
  nft:
    tcp_new_conn_per_ip: 30/second
    udp_pps_per_ip: 500/second
    tcp_burst: 60
    udp_burst: 1000

# 后端游戏服：请将 address 替换为真实 IP（仅示例，非真实业务地址）
servers:
  - name: server-01
    address: 10.0.0.11
    tcp_port: 7777
    udp_port: 7778
    health_check_port: 7777
    enabled: true
  - name: server-02
    address: 10.0.0.12
    tcp_port: 7777
    udp_port: 7778
    health_check_port: 7777
    enabled: true

# 生产入口：production 端口固定映射到对应 server
# 旁路 canary：11001 指向 server-01，验证通过后再启用 production
rules:
  - name: rule-canary-server-01-tcp
    kind: canary
    server: server-01
    protocol: TCP
    listen_port: 11001
    enabled: true

  - name: rule-server-01-tcp-game
    kind: production
    server: server-01
    protocol: TCP
    listen_port: 10001
    enabled: false
  - name: rule-server-02-tcp-game
    kind: production
    server: server-02
    protocol: TCP
    listen_port: 10002
    enabled: false
