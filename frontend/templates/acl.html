{{template "page-start" .}}
  <header class="mb-6">
    <h1 class="text-2xl font-bold tracking-tight">{{T "acl.title"}}</h1>
    <p class="mt-1 text-sm text-rg-muted">{{T "acl.hint"}}</p>
  </header>

  <section class="mb-6">
    <form class="rg-card max-w-md space-y-3 p-5"
      hx-post="/hx/acl"
      hx-target="#acl-table"
      hx-swap="outerHTML"
      hx-on::after-request="if(event.detail.successful) this.reset()">
      <h2 class="text-base font-semibold">{{T "acl.add_heading"}}</h2>
      <label class="block space-y-1 text-xs text-rg-muted">
        <span>{{T "acl.list"}}</span>
        <select class="rg-input" name="list" required>
          <option value="deny">deny</option>
          <option value="allow">allow</option>
        </select>
      </label>
      <label class="block space-y-1 text-xs text-rg-muted">
        <span>{{T "acl.cidr"}}</span>
        <input class="rg-input" name="cidr" type="text" placeholder="1.2.3.4/32" required autocomplete="off"/>
      </label>
      <button class="rg-btn" type="submit">{{T "acl.add"}}</button>
    </form>
  </section>

  {{template "acl-table" .}}
{{template "page-end" .}}
