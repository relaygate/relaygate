{{template "page-start" .}}
  <header class="mb-6">
    <h1 class="text-2xl font-bold tracking-tight">Servers</h1>
    <p class="mt-1 text-sm text-rg-muted">修改后不会自动生效，请到 Apply 页面渲染并热重载 Envoy。添加 Server 时会自动生成对应 production 规则模板（默认关闭）。Canary / Production 列显示该服规则是否已启用。</p>
  </header>

  <section class="rg-card mb-6 p-5">
    <h2 class="mb-4 text-base font-semibold">添加 Server</h2>
    <form
      class="grid grid-cols-1 items-end gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-7"
      hx-post="/hx/servers"
      hx-target="#servers-table"
      hx-swap="outerHTML"
      hx-on::after-request="if(event.detail.successful) this.reset()"
    >
      <label class="space-y-1 text-xs text-rg-muted">
        <span>Name</span>
        <input class="rg-input" name="name" type="text" placeholder="server-11" required autocomplete="off"/>
      </label>
      <label class="space-y-1 text-xs text-rg-muted">
        <span>Address</span>
        <input class="rg-input" name="address" type="text" placeholder="10.0.0.21" required autocomplete="off"/>
      </label>
      <label class="space-y-1 text-xs text-rg-muted">
        <span>TCP</span>
        <input class="rg-input" name="tcp_port" type="number" value="7777"/>
      </label>
      <label class="space-y-1 text-xs text-rg-muted">
        <span>UDP</span>
        <input class="rg-input" name="udp_port" type="number" value="7778"/>
      </label>
      <label class="space-y-1 text-xs text-rg-muted">
        <span>Health</span>
        <input class="rg-input" name="health_check_port" type="number" value="7777"/>
      </label>
      <label class="flex items-center gap-2 pb-2 text-sm text-rg-muted">
        <input class="h-4 w-4 accent-rg-accent" name="enabled" type="checkbox" value="on" checked/>
        Enabled
      </label>
      <button class="rg-btn" type="submit">添加 Server</button>
    </form>
  </section>

  {{template "servers-table" .}}
{{template "page-end" .}}
