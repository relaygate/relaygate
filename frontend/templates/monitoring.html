{{template "page-start" .}}
{{if .GrafanaEnabled}}
  <div class="flex items-center justify-end gap-3 border-b border-rg-line bg-black/20 px-4 py-2.5">
    <a class="rg-btn text-xs" href="/grafana/" target="_blank" rel="noopener">{{T "monitoring.open_window"}}</a>
  </div>
  <iframe class="min-h-0 w-full flex-1 border-0" src="/grafana/" title="Grafana"></iframe>
{{else}}
  <div class="p-6 md:p-8">
    <h1 class="text-2xl font-bold tracking-tight">{{T "monitoring.title"}}</h1>
    <p class="mt-3 max-w-xl text-sm text-rg-muted">
      {{T "monitoring.disabled"}}
    </p>
  </div>
{{end}}
{{template "page-end" .}}
