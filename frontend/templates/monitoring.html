{{template "page-start" .}}
{{if .GrafanaEnabled}}
  <div class="flex items-center justify-end gap-3 border-b border-rg-line bg-black/20 px-4 py-2.5">
    <a class="rg-btn text-xs" href="/grafana/" target="_blank" rel="noopener">新窗口打开</a>
  </div>
  <iframe class="min-h-0 w-full flex-1 border-0" src="/grafana/" title="Grafana"></iframe>
{{else}}
  <div class="p-6 md:p-8">
    <h1 class="text-2xl font-bold tracking-tight">Monitoring</h1>
    <p class="mt-3 max-w-xl text-sm text-rg-muted">
      未启用 Grafana。配置 <code>GRAFANA_URL</code> 并启用 <code>with-grafana</code> 后重启 Panel。
    </p>
  </div>
{{end}}
{{template "page-end" .}}
