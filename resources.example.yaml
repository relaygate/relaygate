# 资产源模板（可安全提交）。真实业务配置由 `relaygate setup` seed 到 DataDir：
#   开发：.runtime/resources.yaml ；安装：/opt/relaygate/data/resources.yaml
# 也可：export RELAYGATE_DATA_DIR=… && cp resources.example.yaml "$RELAYGATE_DATA_DIR/resources.yaml"
# 修改后执行: ./bin/relaygate render

meta:
  gateway_name: gateway-01
  game_name: main
  envoy_image: envoyproxy/envoy:v1.39.0
  admin_port: 9901
  admin_address: 127.0.0.1

gateway:
  name: gateway-01
  public_ip: 203.0.113.10
  ssh_port: 30455
  # 监听地址：公网入口用 0.0.0.0
  listen_address: 0.0.0.0

defaults:
  backend_tcp_port: 7777
  backend_udp_port: 7778
  # TCP 连接空闲超时
  tcp_idle_timeout: 3600s
  # UDP 会话空闲超时（按游戏心跳调整）
  udp_idle_timeout: 120s
  # 单条转发规则最大并发连接/会话
  max_connections: 1024
  max_pending_requests: 256
  # TCP 新建连接本地限速（每秒 token）
  tcp_local_rate_limit_per_sec: 200
  tcp_local_rate_limit_burst: 400
  # 健康检查（仅 TCP upstream cluster）
  health_check:
    timeout: 2s
    interval: 10s
    unhealthy_threshold: 3
    healthy_threshold: 2
  # nftables 限流默认值
  nftables:
    tcp_new_conn_per_ip: 30/second
    udp_pps_per_ip: 500/second
    tcp_burst: 60
    udp_burst: 1000

# IP 黑白名单（nftables 真相源；SSH 不受此约束）
acl:
  deny: []
  allow: []

# 上游（servers）：别名、地址、可选 TCP/UDP（有端口=启用该协议）；无独立 health_check_port（有 TCP 则探活口=tcp.port）
# 入口类型 / listen / 放量不在 Server 上，见下方 rules
servers:
  - name: server-01
    address: 10.0.0.11
    tcp:
      port: 7777
    udp:
      port: 7778
    enabled: true
  - name: server-02
    address: 10.0.0.12
    tcp:
      port: 7777
    udp:
      port: 7778
    enabled: true

# 转发规则：入口类型 entry、协议、listen、开关、指向 server（不管上游 IP/端口）
# 默认递进：验证入口 → 启用正式入口；也可并行同时开。回退=关正式规则。
# 命名：forward-{server}-{entry}-{proto}；entry = validation | production（展示名：验证 / 正式）
rules:
  - name: forward-server-01-validation-tcp
    entry: validation
    server: server-01
    protocol: TCP
    listen_port: 11001
    enabled: true

  - name: forward-server-01-production-tcp
    entry: production
    server: server-01
    protocol: TCP
    listen_port: 10001
    enabled: false
  - name: forward-server-01-production-udp
    entry: production
    server: server-01
    protocol: UDP
    listen_port: 10001
    enabled: false
  - name: forward-server-02-production-tcp
    entry: production
    server: server-02
    protocol: TCP
    listen_port: 10002
    enabled: false
  - name: forward-server-02-production-udp
    entry: production
    server: server-02
    protocol: UDP
    listen_port: 10002
    enabled: false
