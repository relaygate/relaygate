<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rules · RelayGate</title>
  <link rel="stylesheet" href="/static/app.css"/>
</head>
<body>
{{template "nav" .}}
<main>
  <h1>Rules</h1>
  <table>
    <thead>
      <tr><th>Name</th><th>Kind</th><th>Protocol</th><th>Listen</th><th>Server</th><th>Enabled</th></tr>
    </thead>
    <tbody>
      {{range .Rules}}
      <tr>
        <td>{{.Name}}</td>
        <td>{{.Kind}}</td>
        <td>{{.Protocol}}</td>
        <td>{{.ListenPort}}</td>
        <td>{{.Server}}</td>
        <td>
          <label class="switch">
            <input type="checkbox" class="rule-toggle" data-name="{{.Name}}" {{if .Enabled}}checked{{end}}/>
          </label>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>
  <pre id="msg"></pre>
</main>
<script src="/static/app.js"></script>
</body>
</html>
