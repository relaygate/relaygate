# RelayGate: Envoy 转发 + 可观测性（Docker Compose）
# Panel 默认以宿主二进制 + systemd 运行（见 packaging/systemd/、install.sh），
# 不在本文件中定义 panel 服务，也不挂载 docker.sock。
# 每台网关共用本模板，靠 .env 中的 GATEWAY_NAME 等变量区分实例。
# 在仓库根执行:
#   docker compose -f packaging/compose.yaml --env-file .env up -d
#
# Compose profiles（安装角色）：
#   control → Prometheus + node-exporter + Grafana + Loki + Alloy（日志）+ Alertmanager
#   node    → Alloy（指标 scrape + remote_write；无本机 Prometheus/Grafana/Loki）
# Envoy 始终启动（无 profile）。
# provisioning / dashboard JSON 来自本目录 ./grafana/provisioning（版本化）；
# RELAYGATE_DATA_DIR（.env 中由 setup 写入绝对路径）承载渲染产物与 backups；不挂 Grafana 配置。

name: ${COMPOSE_PROJECT_NAME:-relaygate}

services:
  envoy:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.39.0}
    container_name: ${GATEWAY_NAME:?set GATEWAY_NAME}-envoy
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 45s
    stop_signal: SIGTERM
    volumes:
      - ${RELAYGATE_DATA_DIR}/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ${RELAYGATE_DATA_DIR}/envoy/logs:/var/log/envoy
    command:
      - /usr/local/bin/envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --service-cluster
      - ${GATEWAY_NAME}
      - --service-node
      - ${GATEWAY_NAME}
      - --log-level
      - info
      - --concurrency
      - "${ENVOY_CONCURRENCY:-0}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${ENVOY_ADMIN_PORT:-9901} && printf \"GET /ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q LIVE'",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${ENVOY_CPU_LIMIT:-2.0}"
          memory: ${ENVOY_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${ENVOY_CPU_RESERVATION:-0.5}"
          memory: ${ENVOY_MEMORY_RESERVATION:-256M}

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ${GATEWAY_NAME}-prometheus
    network_mode: host
    restart: unless-stopped
    profiles: ["control"]
    volumes:
      - ${RELAYGATE_DATA_DIR}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
      # 节点 Alloy remote_write Bearer 同源：render 同步 AGENT_TOKEN_FILE → agent.token
      # （Prometheus 以 nobody 运行；主控侧此挂载可空文件）
      - ${RELAYGATE_DATA_DIR}/prometheus/agent.token:/etc/prometheus/agent.token:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
      # 仅 loopback；节点 Alloy → Panel /api/agent/metrics/write → 本机 receiver
      - --web.enable-remote-write-receiver
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-2.0}"
          memory: ${PROMETHEUS_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${PROMETHEUS_CPU_RESERVATION:-0.25}"
          memory: ${PROMETHEUS_MEMORY_RESERVATION:-256M}

  grafana:
    image: grafana/grafana:12.1.0
    container_name: ${GATEWAY_NAME}-grafana
    network_mode: host
    restart: unless-stopped
    profiles: ["control"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/relaygate-secrets/grafana_admin_password
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      # 经 Panel 同源反代：子路径 /grafana + 允许同源内嵌。
      # 默认用相对 root_url，适配 SSH 隧道访问 localhost:9000；勿默认成 Grafana 自身 :3000。
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # 匿名 Viewer 仅因 Grafana 绑 loopback 而无法从 Panel 外直达；编辑仍需 admin 登录
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -r "$${GF_SECURITY_ADMIN_PASSWORD__FILE}" ]; then
          export GF_SECURITY_ADMIN_PASSWORD="$$(cat "$${GF_SECURITY_ADMIN_PASSWORD__FILE}")"
        fi
        unset GF_SECURITY_ADMIN_PASSWORD__FILE
        exec /run.sh
    volumes:
      # provisioning（datasources/dashboards）随 packaging 进 release；持久化用命名卷
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      # grafana_admin_password 须 0640（镜像 uid=472 gid=0）；setup/apply 会校正
      - ${RELAYGATE_SECRETS_DIR:-/etc/relaygate/secrets}:/run/relaygate-secrets:ro
    depends_on:
      - prometheus
      - alertmanager
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1.0}"
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${GRAFANA_CPU_RESERVATION:-0.1}"
          memory: ${GRAFANA_MEMORY_RESERVATION:-128M}

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: ${GATEWAY_NAME}-node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    profiles: ["control"]
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "${NODE_EXPORTER_CPU_LIMIT:-0.5}"
          memory: ${NODE_EXPORTER_MEMORY_LIMIT:-128M}
        reservations:
          cpus: "${NODE_EXPORTER_CPU_RESERVATION:-0.05}"
          memory: ${NODE_EXPORTER_MEMORY_RESERVATION:-32M}


  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.0}
    container_name: ${GATEWAY_NAME}-loki
    network_mode: host
    restart: unless-stopped
    profiles: ["control"]
    user: "0:0"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-1.0}"
          memory: ${LOKI_MEMORY_LIMIT:-1G}
        reservations:
          cpus: "${LOKI_CPU_RESERVATION:-0.1}"
          memory: ${LOKI_MEMORY_RESERVATION:-128M}

  # 主控：TCP access → Loki（config.alloy）。节点：指标 scrape + remote_write（config.node.alloy）。
  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.9.2}
    container_name: ${GATEWAY_NAME}-alloy
    network_mode: host
    pid: host
    restart: unless-stopped
    profiles: ["control", "node"]
    environment:
      GATEWAY_NAME: ${GATEWAY_NAME}
      ENVOY_ADMIN_PORT: ${ENVOY_ADMIN_PORT:-9901}
      LOKI_HOST: ${LOKI_HOST:-127.0.0.1}
      LOKI_PORT: ${LOKI_PORT:-3100}
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL:-}
      LOG_SAMPLE_RATE: ${LOG_SAMPLE_RATE:-1.0}
    volumes:
      - ./alloy:/etc/alloy-config:ro
      - ${RELAYGATE_DATA_DIR}/envoy/logs:/var/log/envoy:ro
      - ${RELAYGATE_DATA_DIR}/prometheus/agent.token:/etc/alloy/agent.token:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy-config/${ALLOY_CONFIG_FILE:-config.alloy}
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${ALLOY_CPU_LIMIT:-0.5}"
          memory: ${ALLOY_MEMORY_LIMIT:-256M}
        reservations:
          cpus: "${ALLOY_CPU_RESERVATION:-0.05}"
          memory: ${ALLOY_MEMORY_RESERVATION:-64M}

  # 接收 Prometheus 规则告警（gateway-alerts.yml）。仅主控 control 栈启动。
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    container_name: ${GATEWAY_NAME}-alertmanager
    network_mode: host
    restart: unless-stopped
    profiles: ["control"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${ALERTMANAGER_CPU_LIMIT:-0.25}"
          memory: ${ALERTMANAGER_MEMORY_LIMIT:-128M}
        reservations:
          cpus: "${ALERTMANAGER_CPU_RESERVATION:-0.05}"
          memory: ${ALERTMANAGER_MEMORY_RESERVATION:-32M}

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  alertmanager-data:
