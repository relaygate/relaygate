# RelayGate: Envoy 转发 + 可观测性（Docker Compose）
# Panel 默认以宿主二进制 + systemd 运行（见 packaging/systemd/、install.sh），
# 不在本文件中定义 panel 服务，也不挂载 docker.sock。
# 每台网关共用本模板，靠 .env 中的 GATEWAY_NAME 等变量区分实例。
# 在仓库根执行:
#   docker compose -f packaging/compose.yaml --env-file .env up -d
#
# Grafana 可选：COMPOSE_PROFILES 含 with-grafana（主管理节点推荐）。
# 日志：with-loki（中心 Loki）+ with-logs（每机 Fluent Bit 采集 TCP access）。
#   主节点示例：COMPOSE_PROFILES=with-grafana,with-loki,with-logs
#   从节点示例：COMPOSE_PROFILES=with-logs 且 LOKI_HOST=中心私网 IP
# provisioning / dashboard JSON 来自本目录 ./grafana/provisioning（版本化）；
# RELAYGATE_DATA_DIR（.env 中由 setup 写入绝对路径）承载渲染产物与 backups；不挂 Grafana 配置。
# 从节点可留空 Grafana/Loki profiles，仅跑 Envoy + 本地 Prometheus（remote_write 到中心）+ 可选日志采集。

name: ${COMPOSE_PROJECT_NAME:-relaygate}

services:
  envoy:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.39.0}
    container_name: ${GATEWAY_NAME:?set GATEWAY_NAME}-envoy
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 45s
    stop_signal: SIGTERM
    volumes:
      - ${RELAYGATE_DATA_DIR}/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ${RELAYGATE_DATA_DIR}/envoy/logs:/var/log/envoy
    command:
      - /usr/local/bin/envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --service-cluster
      - ${GATEWAY_NAME}
      - --service-node
      - ${GATEWAY_NAME}
      - --log-level
      - info
      - --concurrency
      - "${ENVOY_CONCURRENCY:-0}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${ENVOY_ADMIN_PORT:-9901} && printf \"GET /ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q LIVE'",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${ENVOY_CPU_LIMIT:-2.0}"
          memory: ${ENVOY_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${ENVOY_CPU_RESERVATION:-0.5}"
          memory: ${ENVOY_MEMORY_RESERVATION:-256M}

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ${GATEWAY_NAME}-prometheus
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${RELAYGATE_DATA_DIR}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-2.0}"
          memory: ${PROMETHEUS_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${PROMETHEUS_CPU_RESERVATION:-0.25}"
          memory: ${PROMETHEUS_MEMORY_RESERVATION:-256M}

  grafana:
    image: grafana/grafana:12.1.0
    container_name: ${GATEWAY_NAME}-grafana
    network_mode: host
    restart: unless-stopped
    profiles: ["with-grafana"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/relaygate-secrets/grafana_admin_password
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      # 经 Panel 同源反代：子路径 /grafana + 允许同源内嵌。
      # 默认用相对 root_url，适配 SSH 隧道访问 localhost:9000；勿默认成 Grafana 自身 :3000。
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # 匿名 Viewer 仅因 Grafana 绑 loopback 而无法从 Panel 外直达；编辑仍需 admin 登录
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -r "$${GF_SECURITY_ADMIN_PASSWORD__FILE}" ]; then
          export GF_SECURITY_ADMIN_PASSWORD="$$(cat "$${GF_SECURITY_ADMIN_PASSWORD__FILE}")"
        fi
        unset GF_SECURITY_ADMIN_PASSWORD__FILE
        exec /run.sh
    volumes:
      # provisioning（datasources/dashboards）随 packaging 进 release；持久化用命名卷
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      # grafana_admin_password 须 0640（镜像 uid=472 gid=0）；setup/apply 会校正
      - ${RELAYGATE_SECRETS_DIR:-/etc/relaygate/secrets}:/run/relaygate-secrets:ro
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1.0}"
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${GRAFANA_CPU_RESERVATION:-0.1}"
          memory: ${GRAFANA_MEMORY_RESERVATION:-128M}

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: ${GATEWAY_NAME}-node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "${NODE_EXPORTER_CPU_LIMIT:-0.5}"
          memory: ${NODE_EXPORTER_MEMORY_LIMIT:-128M}
        reservations:
          cpus: "${NODE_EXPORTER_CPU_RESERVATION:-0.05}"
          memory: ${NODE_EXPORTER_MEMORY_RESERVATION:-32M}


  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.0}
    container_name: ${GATEWAY_NAME}-loki
    network_mode: host
    restart: unless-stopped
    profiles: ["with-loki"]
    user: "0:0"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-1.0}"
          memory: ${LOKI_MEMORY_LIMIT:-1G}
        reservations:
          cpus: "${LOKI_CPU_RESERVATION:-0.1}"
          memory: ${LOKI_MEMORY_RESERVATION:-128M}

  fluent-bit:
    image: ${FLUENT_BIT_IMAGE:-fluent/fluent-bit:3.2.10}
    container_name: ${GATEWAY_NAME}-fluent-bit
    network_mode: host
    restart: unless-stopped
    profiles: ["with-logs"]
    environment:
      GATEWAY_NAME: ${GATEWAY_NAME}
      # 中心 Loki；同机 with-loki 时默认 127.0.0.1
      LOKI_HOST: ${LOKI_HOST:-127.0.0.1}
      LOKI_PORT: ${LOKI_PORT:-3100}
      # P2：正常会话采样率（1.0=全量）；flags≠- 与短会话始终保留
      LOG_SAMPLE_RATE: ${LOG_SAMPLE_RATE:-1.0}
      LOG_SHORT_SESSION_MS: ${LOG_SHORT_SESSION_MS:-2000}
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./fluent-bit/sample.lua:/fluent-bit/etc/sample.lua:ro
      - ${RELAYGATE_DATA_DIR}/envoy/logs:/var/log/envoy:ro
      - fluent-bit-data:/var/log/fluent-bit
    command:
      - /fluent-bit/bin/fluent-bit
      - -c
      - /fluent-bit/etc/fluent-bit.conf
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${FLUENT_BIT_CPU_LIMIT:-0.5}"
          memory: ${FLUENT_BIT_MEMORY_LIMIT:-128M}
        reservations:
          cpus: "${FLUENT_BIT_CPU_RESERVATION:-0.05}"
          memory: ${FLUENT_BIT_MEMORY_RESERVATION:-32M}

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  fluent-bit-data:
