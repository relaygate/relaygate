# RelayGate 可选：TCP 握手 / SYN Flood 防护（sysctl overlay）
# 由 packaging/security/apply-sysctl-harden.sh 安装为
#   /etc/sysctl.d/99-relaygate-tcp-harden.conf
# 不替代 packaging/sysctl/gateway.conf（somaxconn / 缓冲 / file-max 等仍由后者负责）。
# 下列键由 security.policies[kernel_syn].params 生成（relaygate security kernel-conf）。
# 目标：half-open 队列与 SYN cookies；不影响已建立（established）长连接（long-lived TCP）。

# 开启 SYN cookies，缓解半开连接（half-open）队列打满
net.ipv4.tcp_syncookies = 1

# SYN backlog（与 somaxconn 配合；洪泛时提高可接纳的握手积压）
net.ipv4.tcp_max_syn_backlog = 8192

# 缩短未完成握手的重试，降低 half-open 占用（established 不受影响）
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 3

# 过载时不直接 abort 新建（long-lived 网关更倾向排队 / rate limiting 拒绝，而非内核粗暴断开）
net.ipv4.tcp_abort_on_overflow = 0
