# RelayGate Loki（单机/中心起步）。监听 loopback，与 Prometheus/Grafana 一致。
# 保留期见 limits_config.retention_period；对照文档 LOKI_RETENTION_PERIOD（默认 168h）。
# 高流量可缩短保留或开启 Alloy 采样（LOG_SAMPLE_RATE）。

auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  max_query_series: 5000
  max_entries_limit_per_query: 5000
  # 客户端 IP 勿做 label；structured metadata 关，避免高基数
  allow_structured_metadata: false
  volume_enabled: true

ruler:
  enable_api: true
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  # 与主控 Compose Alertmanager（with-grafana）对齐；外发仍看 alertmanager.yml receivers
  alertmanager_url: http://127.0.0.1:9093

analytics:
  reporting_enabled: false
