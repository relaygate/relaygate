[SERVICE]
    Flush           1
    Daemon          Off
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf
    HTTP_Server     On
    HTTP_Listen     127.0.0.1
    HTTP_Port       2020

[INPUT]
    Name              tail
    Tag               envoy.tcp.access
    Path              /var/log/envoy/tcp-access.json
    Parser            envoy_tcp_access
    Mem_Buf_Limit     32MB
    Skip_Long_Lines   On
    Refresh_Interval  2
    DB                /var/log/fluent-bit/tcp-access.db
    DB.Sync           Normal
    Read_from_Head    false

# 异常 flags / 短会话：打 keep=1，供采样脚本全量保留
[FILTER]
    Name          lua
    Match         envoy.tcp.access
    script        /fluent-bit/etc/sample.lua
    call          cb_sample

[FILTER]
    Name          modify
    Match         envoy.tcp.access
    Set           job envoy-tcp-access
    # GATEWAY_NAME 由 compose environment 注入
    Add           gateway ${GATEWAY_NAME}

[FILTER]
    Name          record_modifier
    Match         envoy.tcp.access
    Remove_key    path

[OUTPUT]
    Name        loki
    Match       envoy.tcp.access
    Host        ${LOKI_HOST}
    Port        ${LOKI_PORT}
    Labels      job=$job,gateway=$gateway
    # 整行 JSON 作为 log；勿把 downstream 提成 label
    line_format json
    auto_kubernetes_labels off
    workers     1
