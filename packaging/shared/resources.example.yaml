# 资产源模板（可安全提交）。真实业务配置由 `relaygate setup` seed 到 DataDir：
#   开发：.runtime/resources.yaml ；安装：/opt/relaygate/data/resources.yaml
# 也可：export RELAYGATE_DATA_DIR=… && cp packaging/shared/resources.example.yaml "$RELAYGATE_DATA_DIR/resources.yaml"
# 修改后执行: ./bin/relaygate render

meta:
  service_name: main
  envoy_image: envoyproxy/envoy:v1.39.0
  admin_port: 9901
  admin_address: 127.0.0.1

gateway:
  name: gateway-01
  public_ip: 203.0.113.10
  ssh_port: 22
  listen_address: 0.0.0.0

defaults:
  default_upstream_tcp_port: 7777
  default_upstream_udp_port: 7778
  tcp_idle_timeout: 3600s
  udp_idle_timeout: 120s
  max_pending_requests: 256
  health_check:
    timeout: 2s
    interval: 10s
    unhealthy_threshold: 3
    healthy_threshold: 2
  outlier_detection:
    enabled: false
    consecutive_local_origin_failure: 5
    interval: 10s
    base_ejection_time: 30s

security:
  access:
    enabled: true
    deny: []
    allow: []
  protections:
    - id: kernel_syn
      type: kernel_syn
      enabled: true
      attack_tags: [T1]
      params:
        tcp_syncookies: 1
        tcp_max_syn_backlog: 8192
        tcp_synack_retries: 2
        tcp_syn_retries: 3
        tcp_abort_on_overflow: 0
    - id: firewall_new_conn_limit
      type: firewall_new_conn_limit
      enabled: true
      attack_tags: [T1, T4]
      params:
        tcp_per_ip: 30/second
        burst: 60
    - id: gateway_new_conn_limit
      type: gateway_new_conn_limit
      enabled: true
      attack_tags: [T1, T4]
      params:
        per_sec: 200
        burst: 400
    - id: gateway_conn_limit
      type: gateway_conn_limit
      enabled: true
      attack_tags: [T2]
      params:
        max_connections: 1024
    - id: firewall_udp_limit
      type: firewall_udp_limit
      enabled: true
      attack_tags: [T6]
      params:
        udp_pps_per_ip: 500/second
        udp_burst: 1000
    # 网卡出口整形（tc）；默认关闭。主控 PANEL_ENABLED=1 不会自动 apply；节点可按 SECURITY_AUTO_APPLY
    - id: nic_egress_shape
      type: nic_egress_shape
      enabled: false
      attack_tags: [T7]
      params:
        device: ""
        rate: 3mbit
    # 网卡入向 police（tc ingress）；默认关闭。管入向带宽，不替代高防
    - id: nic_ingress_police
      type: nic_ingress_police
      enabled: false
      attack_tags: [T7]
      params:
        device: ""
        rate: 3mbit

# 上游：别名、地址、可选 TCP/UDP 端口（有端口=启用该协议）
upstreams:
  - name: server-01
    address: 10.0.0.11
    tcp:
      port: 7777
    udp:
      port: 7778
    enabled: true
  - name: server-02
    address: 10.0.0.12
    tcp:
      port: 7777
    udp:
      port: 7778
    enabled: true

# 转发：入口 entry、协议、listen、开关 → 引用 upstream
# 命名：forward-{upstream}-{entry}-{proto}；entry = validation | production
forwards:
  - name: forward-server-01-validation-tcp
    entry: validation
    upstream: server-01
    protocol: TCP
    listen_port: 11001
    enabled: true

  - name: forward-server-01-production-tcp
    entry: production
    upstream: server-01
    protocol: TCP
    listen_port: 10001
    enabled: false
  - name: forward-server-01-production-udp
    entry: production
    upstream: server-01
    protocol: UDP
    listen_port: 10001
    enabled: false
  - name: forward-server-02-production-tcp
    entry: production
    upstream: server-02
    protocol: TCP
    listen_port: 10002
    enabled: false
  - name: forward-server-02-production-udp
    entry: production
    upstream: server-02
    protocol: UDP
    listen_port: 10002
    enabled: false
