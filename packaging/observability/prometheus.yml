# Shared Prometheus scrape config for the monitoring Compose stack.
# Edit targets for private IPs, VPN hostnames, or local SSH tunnel ports.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: relaygate
    role: observability

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["gateway-01.internal:9901"]
        labels:
          gateway: gateway-01
          role: gateway
          host: gateway-01
      - targets: ["gateway-02.internal:9901"]
        labels:
          gateway: gateway-02
          role: gateway
          host: gateway-02

  - job_name: node
    static_configs:
      - targets: ["gateway-01.internal:9100"]
        labels:
          gateway: gateway-01
          role: host
          host: gateway-01
      - targets: ["gateway-02.internal:9100"]
        labels:
          gateway: gateway-02
          role: host
          host: gateway-02

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          role: observability
