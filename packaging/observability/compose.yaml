# Optional shared metrics/logs stack (Prometheus + Grafana + optional Loki) on a dedicated host
# or beside a gateway. Scrapes edge Envoy / node_exporter over private
# network, VPN, or SSH tunnels.
#
# Templates under ../prometheus and ../grafana are shared with the gateway
# Compose stack; this directory is only the optional Compose *project*.
#
#   cp .env.example .env && chmod 600 .env
#   docker compose --env-file .env up -d
#
# From repo root:
#   docker compose -f packaging/observability/compose.yaml \
#     --env-file packaging/observability/.env up -d

name: relaygate-observability

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"


  # 可选中心 Loki（与网关 with-loki 二选一；边缘 Fluent Bit 推到此 Host:3100）
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.0}
    restart: unless-stopped
    profiles: ["with-loki"]
    user: "0:0"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ../loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
