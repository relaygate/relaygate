# 高并发短连接：放宽新建连接令牌，提高 pending 与并发上限
name: tcp-short-burst
scenario: tcp_short_burst
description: 适合高并发短连接；放宽 nft / Envoy 新建速率，提高 max_connections

defaults:
  default_upstream_tcp_port: 7777
  default_upstream_udp_port: 7778
  tcp_idle_timeout: 300s
  udp_idle_timeout: 60s
  max_pending_requests: 1024
  health_check:
    timeout: 2s
    interval: 5s
    unhealthy_threshold: 3
    healthy_threshold: 2

security:
  policies:
    - id: firewall_new_conn_limit
      type: new_conn_limit_firewall
      enabled: true
      params:
        tcp_per_ip: 80/second
        burst: 160
    - id: gateway_new_conn_limit
      type: new_conn_limit_gateway
      enabled: true
      params:
        per_sec: 800
        burst: 1600
    - id: conn_limit
      type: conn_limit
      enabled: true
      params:
        max_connections: 4096
    - id: udp_limit
      type: udp_limit
      enabled: true
      params:
        udp_pps_per_ip: 400/second
        udp_burst: 800
