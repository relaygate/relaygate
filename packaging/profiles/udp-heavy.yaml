# UDP 侧重：放宽 UDP PPS，缩短 UDP idle
# 不写 access：合并时保留节点当前名单
name: udp-heavy
scenario: udp_heavy
description: 适合 UDP 包率较高的业务；放宽防火墙 UDP PPS，仍需云侧挡大流量洪泛

defaults:
  default_upstream_tcp_port: 7777
  default_upstream_udp_port: 7778
  tcp_idle_timeout: 1800s
  udp_idle_timeout: 60s
  max_pending_requests: 512
  health_check:
    timeout: 2s
    interval: 10s
    unhealthy_threshold: 3
    healthy_threshold: 2

security:
  protections:
    - id: firewall_new_conn_limit
      type: firewall_new_conn_limit
      enabled: true
      params:
        tcp_per_ip: 40/second
        burst: 80
    - id: gateway_new_conn_limit
      type: gateway_new_conn_limit
      enabled: true
      params:
        per_sec: 400
        burst: 800
    - id: gateway_conn_limit
      type: gateway_conn_limit
      enabled: true
      params:
        max_connections: 2048
    - id: firewall_udp_limit
      type: firewall_udp_limit
      enabled: true
      params:
        udp_pps_per_ip: 1200/second
        udp_burst: 2400
    # UDP 侧重场景默认不开出口/入向整形（避免误伤）；低带宽主机可改用 tcp-longlived 或手动开启
    - id: nic_egress_shape
      type: nic_egress_shape
      enabled: false
      params:
        device: ""
        rate: 3mbit
    - id: nic_ingress_police
      type: nic_ingress_police
      enabled: false
      params:
        device: ""
        rate: 3mbit
