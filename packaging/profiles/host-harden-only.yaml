# 仅主机加固：保留 kernel_syn，关闭防火墙 / 网关业务限速（仍保留默认策略结构）
name: host-harden-only
scenario: host_harden_only
description: 仅内核 SYN 加固；nft 与 Envoy 限速策略关闭，由外部高防或上游承担

defaults:
  default_upstream_tcp_port: 7777
  default_upstream_udp_port: 7778
  tcp_idle_timeout: 3600s
  udp_idle_timeout: 120s
  max_pending_requests: 256
  health_check:
    timeout: 2s
    interval: 10s
    unhealthy_threshold: 3
    healthy_threshold: 2

security:
  policies:
    - id: kernel_syn
      type: kernel
      enabled: true
    - id: firewall_new_conn_limit
      type: new_conn_limit_firewall
      enabled: false
    - id: gateway_new_conn_limit
      type: new_conn_limit_gateway
      enabled: false
    - id: conn_limit
      type: conn_limit
      enabled: false
    - id: allowlist
      type: allowlist
      enabled: false
    - id: udp_limit
      type: udp_limit
      enabled: false
