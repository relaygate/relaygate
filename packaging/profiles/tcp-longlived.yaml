# TCP 长连接安全策略（小包交互基线）
#
# 流量特征依据见 docs/packet-size-traffic-analysis.md：
#   · 正常：0–199 字节主导（established 上心跳/短载荷常见）→ 勿对已建会话做 PPS
#   · 攻击：近 MTU（约 1400–1499）单峰体量 → 本机限速减负；清洗走云高防（T7 out of scope）
#
# 相对 default-l4：拉长 idle、提高并发；相对旧版「过紧新建」适当放宽 new 余量，
# 以容纳断线重连潮，同时仍低于 tcp-short-burst 的握手洪泛档。
# 不写 access：合并时保留节点当前名单
name: tcp-longlived
scenario: tcp_longlived
description: TCP 长连接场景安全策略；按小包主导业务放宽 idle/并发与新建余量，established 先放行

defaults:
  default_upstream_tcp_port: 7777
  default_upstream_udp_port: 7778
  # 稀疏小包心跳下会话仍存活；过短 idle 会误杀长连（T3）
  tcp_idle_timeout: 14400s
  udp_idle_timeout: 120s
  max_pending_requests: 1024
  health_check:
    timeout: 2s
    interval: 10s
    unhealthy_threshold: 3
    healthy_threshold: 2

security:
  protections:
    # 仅 ct state new；小包业务 PPS 走 established，不受本条限制
    - id: firewall_new_conn_limit
      type: firewall_new_conn_limit
      enabled: true
      params:
        tcp_per_ip: 40/second
        burst: 80
    - id: gateway_new_conn_limit
      type: gateway_new_conn_limit
      enabled: true
      params:
        per_sec: 150
        burst: 300
    # 长连接并发槽位；调高后请核对 Prometheus EnvoyConnectionsNearLimit（约 80%）
    - id: gateway_conn_limit
      type: gateway_conn_limit
      enabled: true
      params:
        max_connections: 4096
    - id: firewall_udp_limit
      type: firewall_udp_limit
      enabled: true
      params:
        udp_pps_per_ip: 500/second
        udp_burst: 1000
