name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22.x"
  ENVOY_IMAGE: envoyproxy/envoy:v1.39.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet / test / build
        run: |
          go vet ./...
          go test ./...
          make build

      - name: validate + compose + envoy
        run: |
          set -euo pipefail
          mkdir -p .runtime
          cp packaging/shared/resources.example.yaml .runtime/resources.yaml
          cp packaging/control/env.example .env
          echo "RELAYGATE_DATA_DIR=$PWD/.runtime" >> .env
          ./bin/relaygate validate
          grep -q 'gateway: gateway-01' .runtime/prometheus/prometheus.yml
          cp packaging/node/env.example .env
          echo "RELAYGATE_DATA_DIR=$PWD/.runtime" >> .env
          ./bin/relaygate validate
          grep -q 'gateway: gateway-02' .runtime/prometheus/prometheus.yml
          docker compose -f packaging/compose.yaml --env-file .env config >/dev/null
          docker run --rm \
            -v "$PWD/.runtime/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro" \
            "${ENVOY_IMAGE}" \
            /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --mode validate

      - name: make dist (amd64 smoke)
        run: make dist VERSION=ci-smoke GOARCH=amd64
        env:
          GOOS: linux
