name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22.x"
  ENVOY_IMAGE: envoyproxy/envoy:v1.39.0
  PANEL_IMAGE: ghcr.io/${{ github.repository }}/relaygate-panel

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build relaygate
        run: bash scripts/build.sh

      - name: render check (gateway-01 + gateway-02 labels)
        run: |
          set -euo pipefail
          cp deploy/env/gateway-01.env.example .env
          bash scripts/render_observability.sh .env
          ./bin/relaygate render --check-only
          ./bin/relaygate render
          grep -q 'gateway: gateway-01' deploy/prometheus/prometheus.yml

          cp deploy/env/gateway-02.env.example .env
          bash scripts/render_observability.sh .env
          grep -q 'gateway: gateway-02' deploy/prometheus/prometheus.yml

      - name: compose config (both gateway envs)
        run: |
          set -euo pipefail
          cp deploy/env/gateway-01.env.example .env
          docker compose -f deploy/compose.yaml --env-file .env config >/dev/null
          cp deploy/env/gateway-02.env.example .env
          docker compose -f deploy/compose.yaml --env-file .env config >/dev/null

      - name: Envoy config validate
        run: |
          docker run --rm \
            -v "$PWD/gateway/generated/envoy.yaml:/etc/envoy/envoy.yaml:ro" \
            "${ENVOY_IMAGE}" \
            /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --mode validate

  build-scan:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (immutable tag = git sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PANEL_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build panel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.panel
          push: false
          load: true
          tags: ${{ env.PANEL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.PANEL_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main only, never latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.panel
          push: true
          tags: ${{ env.PANEL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging-matrix:
    needs: build-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        gateway: [gateway-01, gateway-02]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy one gateway (drain → sync → reload → smoke)
        env:
          DEPLOY_HOST: ${{ matrix.gateway == 'gateway-01' && secrets.GATEWAY_01_HOST || secrets.GATEWAY_02_HOST }}
          DEPLOY_PORT: ${{ matrix.gateway == 'gateway-01' && secrets.GATEWAY_01_SSH_PORT || secrets.GATEWAY_02_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST:-}" || -z "${DEPLOY_KEY:-}" ]]; then
            echo "Skipping deploy: DEPLOY secrets not configured for ${{ matrix.gateway }}"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-30455}"
          RDIR="${REMOTE_DIR:-/opt/relaygate}"
          SSH=(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}")

          echo "==> [${{ matrix.gateway }}] drain"
          "${SSH[@]}" "cd '$RDIR' && bash scripts/drain_gateway.sh fail"

          echo "==> [${{ matrix.gateway }}] sync"
          "${SSH[@]}" "cd '$RDIR' && git fetch --all && git checkout '${{ github.sha }}' && git pull --ff-only || git reset --hard '${{ github.sha }}'"
          "${SSH[@]}" "cd '$RDIR' && (grep -q '^IMAGE_TAG=' .env && sed -i 's|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|' .env || echo IMAGE_TAG=${IMAGE_TAG} >> .env)"

          echo "==> [${{ matrix.gateway }}] reload"
          "${SSH[@]}" "cd '$RDIR' && bash scripts/render_observability.sh .env && bash scripts/reload_envoy.sh"

          echo "==> [${{ matrix.gateway }}] undrain + smoke"
          "${SSH[@]}" "cd '$RDIR' && bash scripts/drain_gateway.sh ok && bash scripts/smoke_test.sh 127.0.0.1"
